name: Experimental APK
# Full current-project verification: Android APK + Core contract tests.
# Jobs are independent so a failure in one layer does not block another.

on:
  push:
    branches:
      - codex/phase-c-handoff
    paths:
      - '.github/workflows/experimental-apk.yml'
      - 'app/**'
      - 'core/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this experimental build'
        required: false
        default: 'manual verification'

permissions:
  contents: read

concurrency:
  group: experimental-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-contract-tests:
    name: Core Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run core contract tests
        run: ./gradlew :core:test --no-daemon --console=plain --rerun

  android-instrumented-tests:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 120
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace

  apk-assembly:
    name: APK Assembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "No debug APK was produced."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: aethra-experimental-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
