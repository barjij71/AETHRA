name: AETHRA Skill Core

on:
  push:
    branches: ["feature/skill-orchestration-architecture"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test Core
        run: gradle :core:test
      - name: Compile Core
        run: gradle :core:compileKotlin
